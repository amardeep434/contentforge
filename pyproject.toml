[project]
name = "contentforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.0",
    "google-api-python-client>=2.0",
    # Lettering, the sheet and the palette correction are all production paths,
    # not optional extras: a frame without them does not match the reference.
    "pillow>=10.0",
]

[project.optional-dependencies]
# Local image generation. Kept optional so research and publishing still work
# on a machine with no GPU. Install torch from the CUDA index first - see
# docs/setup/local-image-generation.md; plain `pip install torch` silently
# fetches the CPU-only build.
gpu = [
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
]
# Publishing to YouTube. Kept optional so research and rendering need no Google
# auth libraries. google-api-python-client is already a core dependency; these
# add the OAuth user-consent flow that uploading (unlike scraping) requires.
publish = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
pipeline = "contentforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
